name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build clean image
        run: docker build --platform linux/amd64 -t music-ingest:check .
      - name: Test without personal data
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=1g
          --cap-drop ALL --security-opt no-new-privileges:true
          -v "$PWD/tests:/tests:ro" -v "$PWD/tools/test-container.sh:/test.sh:ro"
          --entrypoint sh music-ingest:check /test.sh
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Lincktendo/music-ingest'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then exit 1; fi
          echo "tag=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lincktendo/music-ingest:${{ steps.version.outputs.tag }}
            ghcr.io/lincktendo/music-ingest:latest
          provenance: mode=max
          sbom: true
