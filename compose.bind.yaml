# Optional: use an existing host music directory instead of the named music volume.
# Set MUSIC_FOLDER in .env. The directory must exist and be writable by UID 10001.
services:
  music-ingest:
    volumes:
      - type: bind
        source: ${MUSIC_FOLDER:?Set MUSIC_FOLDER to your existing music directory}
        target: /music
        bind:
          create_host_path: false
